name: EXPERT PREPA CM2 - Assemblage audio deux voix
on:
  push:
    paths:
      - experts_prepa_cm2_audio/lot_*.json
      - scripts/exp_prepa_dictee_pack_audio.py
      - .github/workflows/exp-prepa-assemble-2-voix.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assembler:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer FFmpeg et traitement audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install pydub
      - name: Assembler les enregistrements et contrôler leur durée
        run: python scripts/exp_prepa_dictee_pack_audio.py
      - name: Exporter les fichiers MP3 et le rapport de contrôle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EXPERT_PREPA_CM2_DIC_TECHNIQUEMENT_PRODUITES
          path: sorties-exp-prepa/
          if-no-files-found: warn
          retention-days: 7
