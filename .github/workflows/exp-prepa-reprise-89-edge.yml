name: EXPERT PREPA CM2 - Test Studio Vocal DEEG sans HeyGen
on:
  push:
    paths:
      - .github/workflows/exp-prepa-reprise-89-edge.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer moteur vocal et FFmpeg
        run: |
          python -m pip install -r requirements-edge.txt pydub
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Vérifier une dictée pilote (voix masculine)
        run: python scripts/exp_prepa_reprise_89_studio_edge.py --shards 6 --shard 0 --limit 1
      - name: Publier le fichier de contrôle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EXPERT_PREPA_TEST_STUDIO_DEEG
          path: |
            sorties-cm2-studio-secours/*.mp3
            sorties-cm2-studio-secours/*.json
          if-no-files-found: warn
          retention-days: 7
