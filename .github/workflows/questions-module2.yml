name: Questions finales DEEG Module 2 — voix B

on:
  push:
    paths:
      - '.github/workflows/questions-module2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthese-questions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEEG_SPEED: '85'
      DEEG_REF_URL: ${{ secrets.DEEG_TANGUY_REFERENCE_URL }}
      OMP_NUM_THREADS: '4'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verifier le secret
        shell: bash
        run: |
          test -n "${DEEG_REF_URL}"
          [[ "${DEEG_REF_URL}" == https://* ]]
      - name: FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Preparer extrait vocal B sans le publier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .modeles
          curl -fsSL --retry 2 --max-time 120 --max-filesize 16000000 -o .modeles/ref_source "${DEEG_REF_URL}"
          ffmpeg -hide_banner -loglevel error -y -ss 43.16 -t 9.40 -i .modeles/ref_source -ar 24000 -ac 1 -c:a pcm_s16le .modeles/tanguy_pose.wav
          test -s .modeles/tanguy_pose.wav
          rm -f .modeles/ref_source
      - name: Installer Chatterbox Multilingual V3
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0+cpu torchaudio==2.6.0+cpu
          python -m pip install -r requirements-clonage.txt
      - name: Produire les 3 questions avec voix B
        run: python scripts/generer_questions_module2.py
      - name: Publier les 3 fichiers audio
        uses: actions/upload-artifact@v4
        with:
          name: questions-finales-deeg-module2-${{ github.run_number }}
          path: sorties-questions-module2/
          if-no-files-found: error
          retention-days: 7
