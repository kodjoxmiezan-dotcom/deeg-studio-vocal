name: EXPERIMENTAL - Kokoro 82M voix francaise

on:
  workflow_dispatch:
    inputs:
      texte:
        description: "Passage francais pour un essai (maximum 800 caracteres)"
        required: true
        type: string
        default: "Bienvenue dans le studio vocal. Chaque matin, a l'ecole, les filles et les garcons apprennent ensemble. Le role de chaque adulte est de creer un environnement protecteur et inclusif."
      vitesse:
        description: "Vitesse de l'essai (%)"
        required: true
        type: choice
        options:
          - "80"
          - "85"
          - "90"
          - "100"
        default: "85"
  push:
    branches:
      - amelioration/essai-kokoro-fr-2026-11
    paths:
      - scripts/essai_kokoro_fr.py
      - requirements-kokoro.txt
      - tests/test_kokoro_pipeline.py
      - .github/workflows/essai-kokoro-fr.yml

permissions:
  contents: read

jobs:
  synthese-kokoro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEEG_TEXT: ${{ inputs.texte || '' }}
      DEEG_SPEED: ${{ inputs.vitesse || '85' }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test leger avant installation IA
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_kokoro_pipeline.py tests/test_utils.py
      - name: Installer ffmpeg et espeak-ng
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Installer PyTorch CPU et Kokoro
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0+cpu
          python -m pip install -r requirements-kokoro.txt
      - name: Produire la voix francophone d'essai
        run: python scripts/essai_kokoro_fr.py
      - name: Publier les sorties pour ecoute
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-ff-siwis-${{ github.run_number }}
          path: sorties-kokoro/
          if-no-files-found: error
          retention-days: 7
